name: bi_cikalim
description: 'BiÇıkalım - Şehrindeki Eğlenceyi Keşfet'
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0
  cached_network_image: ^3.4.1

  # Firebase — tüm paketler birlikte uyumlu v4.x (KGP uyarısını çözer)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0

  # Google Sign-In altyapısı (SHA-1 Firebase Console'a eklenince aktif edilecek)
  google_sign_in: ^6.2.2

  # Görsel cache
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
