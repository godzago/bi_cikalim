name: bi_cikalim
description: 'BiÇıkalım - Şehrindeki Eğlenceyi Keşfet'
publish_to: 'This is a Demirdoven Holding Project. Do not use in production.'

version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0

  # Görsel cache
  cached_network_image: ^3.4.1

  # Google Fonts
  google_fonts: ^6.1.0

  # Networking
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^10.3.1

  # Maps (OpenStreetMap with Leaflet)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - api_config.json
